# The 75 service descriptions — SPEC §6 / §10 step 2, decision D2.
#
# WHY THIS FILE EXISTS AND WHY IT IS NOT GENERATED.
# 568 deals share only 75 titles, and the titles are generic ("Sesja Wellness",
# "Wellness-Massage Paket"). Embedding those gets you nothing, so each service
# needs a short description that says what it actually is.
#
# D2 forbids LLM-*enriching* these, and the reason is specific: if generated text
# writes "outdoor adventure, adrenaline, thrills" onto the activities deals, then
# skydiving clears the similarity floor, F4 collapses into F1, and the central
# finding of the whole analysis becomes an artifact of generated text.
#
# THE RULE EVERY LINE OBEYS: say only what the title and category already entail.
# No aspirational vocabulary, no category words the catalogue cannot back, no
# naming of a concept the analysis has NOT established as stocked. Where a title
# is vague, the description stays vague — vagueness is the honest answer.
#
# ENFORCED, NOT PROMISED. `check_descriptions.py` derives a forbidden-token list
# from classify.py's own CONCEPTS map and fails if any description contains one.
# It covers the five ABSENT concepts (adrenaline, bowling, lashes, paintball,
# sushi) and — just as important — the four PLAUSIBLE ones (yoga, pilates,
# crossfit, dining_specific), because naming those would silently promote a
# deliberate "plausible" to "stocked" and make a judgement call disappear.
#
# LANGUAGE: each description is in its own market's language, matching its title.
# This is deliberate and load-bearing. If every doc also carried English, English
# queries would match better because of the document rather than because of the
# multilingual model — which would make FINDINGS §5b's language test unmeasurable
# on this prototype. `gloss_en` exists ONLY for human review; it is never embedded
# and never reaches the database.
#
# REVIEW: read `title` against `description` and ask one question — does the
# description claim anything the title does not already say? If yes, cut it.

