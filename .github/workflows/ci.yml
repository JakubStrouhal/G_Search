name: CI

# The build is the gate. `npm run build` is `vue-tsc -b && vite build`, so type errors
# fail it — there is no separate typecheck step and no test step, because there are no
# tests yet. The agent refusal fixture (006-one-page/SPEC.md §5) lands with build step 4;
# it gets a job here when the fixture file exists, not before.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22.16'
          cache: npm
          cache-dependency-path: web/app/package-lock.json

      # `npm ci` hard-fails if package-lock.json is out of sync with package.json.
      - run: npm --prefix web/app ci

      # `prebuild` runs web/app/scripts/copy-explainer.mjs, which reads
      # docs/analysis/004-data-story/outputs/explainer.html from OUTSIDE web/app.
      # This is why the build runs from the repo root and why Vercel's root directory
      # must stay at the repo root too (see vercel.json).
      - run: npm --prefix web/app run build

# Migrations are deliberately NOT applied here. CLAUDE.md requires one reviewed migration
# generated by `supabase db pull --local`, and explicit per-run approval for mutating SQL
# against the remote project. An automated `db push` would break both rules, so schema
# deployment stays manual and is documented in README § Deploy.
